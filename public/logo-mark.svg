<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Charcoal rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#26282B"/>

  <!-- Water drop shape, sky blue -->
  <path
    d="M50 18
       C50 18 30 46 30 62
       C30 76.4 38.7 87 50 87
       C61.3 87 70 76.4 70 62
       C70 46 50 18 50 18 Z"
    fill="#4FA8D8"
  />

  <!-- Drill bit / auger notch cut into the bottom of the drop, suggesting drilling -->
  <path
    d="M43 62 L50 87 L57 62 Z"
    fill="#26282B"
    opacity="0.85"
  />
  <path d="M45.5 64 L50 80 L54.5 64 Z" fill="#26282B" opacity="0.5"/>

  <!-- Subtle highlight on the drop for depth -->
  <path
    d="M40 40 C36 48 34 55 34 61"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    opacity="0.35"
  />
</svg>
